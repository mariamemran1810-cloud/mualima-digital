<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>امسحي الرمز لفتح الموقع</title>
<style>
  body{font-family:"Segoe UI",Tahoma,sans-serif;background:linear-gradient(135deg,#5b3df5,#0ea5a4);min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}
  .card{background:#fff;border-radius:24px;padding:34px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);max-width:420px}
  h1{color:#1c2237;font-size:24px;margin:0 0 6px}
  p{color:#5c6580;margin:0 0 18px;font-size:15px}
  img{width:260px;height:260px;border-radius:16px}
  .url{direction:ltr;display:inline-block;background:#eef1fa;color:#5b3df5;font-weight:700;padding:10px 18px;border-radius:12px;margin-top:16px;font-size:17px;user-select:all}
  .hint{font-size:13px;color:#8b93ad;margin-top:16px}
</style>
</head>
<body>
  <div class="card">
    <h1>👩‍🏫 كرّاسة التحضير — المعلمة الرقمية</h1>
    <p>افتح الكاميرا في هاتفك وامسحي الرمز</p>
    <img id="qr" alt="QR" src="">
    <div><span class="url" id="url"></span></div>
    <p class="hint">⚠️ يجب أن يكون الهاتف متصلًا بنفس شبكة الواي‑فاي (الإنترنت) الخاصة بالكمبيوتر</p>
  </div>
<script>
  const url = location.origin;
  document.getElementById("url").textContent = url;
  document.getElementById("qr").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=8&data=" + encodeURIComponent(url);
</script>
</body>
</html>
